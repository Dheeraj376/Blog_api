<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Blog</title>
  <style>
    body { font-family: Arial; padding: 40px; text-align: center; background: #f8d7da; color: #721c24; }
    form { display: inline-block; margin-top: 20px; }
    button {
      padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px;
    }
    .confirm { background-color: #dc3545; color: white; }
    .cancel { background-color: #6c757d; color: white; margin-left: 10px; }
  </style>
</head>
<body>

  <h2>Are you sure you want to delete this blog post?</h2>
  <p><strong>{{ blog.title }}</strong> by {{ blog.author }}</p>

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="author" value="{{ blog.author }}">
    <button type="submit" class="confirm">Yes, Delete</button>
    <a href="/manage/" class="cancel">Cancel</a>
  </form>

</body>
</html>
