<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Blog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
    }

    form {
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      position: relative;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background-color: #0056b3;
    }

    .register-link {
      margin-top: 20px;
      text-align: center;
    }

    .register-link a {
      color: #007BFF;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .visibility-buttons {
      display: flex;
      gap: 10px;
    }

    .visibility-btn {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      background-color: #e9ecef;
      color: #000;
      transition: background-color 0.3s ease;
    }

    .visibility-btn.active {
      background-color: #007BFF;
      color: white;
      border-color: #0056b3;
    }

    input[name="visibility"] {
      display: none;
    }

    

    /* Common styles for both back link and button */
    .add-button.back-manage,
    #back-button {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 18px;
      border-radius: 5px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgb(0 123 255 / 0.3);
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
      user-select: none;
      font-size: 16px;
      text-align: center;
    }

    .add-button.back-manage:hover,
    #back-button:hover {
      background-color: #0069d9;
      box-shadow: 0 4px 12px rgb(0 105 217 / 0.4);
    }

    /* Responsive adjustments */
    @media (max-width: 560px) {
      form {
        padding: 30px 20px 40px 20px;
        max-width: 100%;
      }
      .top-bar {
        justify-content: center;
        margin-bottom: 20px;
      }
      .add-button.back-manage,
      #back-button {
        width: 48%;
        font-size: 14px;
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  

  <form method="post" aria-label="Create Blog Form">
    {% csrf_token %}
    <h1>Create Your Blog</h1>

    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="Enter title" required />
    </div>

    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" placeholder="Enter content" rows="6" required></textarea>
    </div>

    

    <div class="form-group">
      <label for="created_date">Created Date</label>
      <input type="date" id="created_date" name="created_date" required />
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select name="status" id="status" required>
        <option value="">-- Select Status --</option>
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>

    <div class="form-group">
      <label>Visibility</label>
      <div class="visibility-buttons">
        <button type="button" class="visibility-btn" data-value="public">Public</button>
        <button type="button" class="visibility-btn" data-value="private">Private</button>
      </div>
      <input type="hidden" name="visibility" id="visibility" value="" />
    </div>

    <button type="submit">Submit</button>
  </form>

  <div class="register-link">
    <p>Want to manage blogs? <a href="/manage?username={{ user.username }}">Click here for Blog Actions</a></p>
  </div>

  <script>
    // Visibility buttons logic
    const buttons = document.querySelectorAll('.visibility-btn');
    const hiddenInput = document.getElementById('visibility');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        hiddenInput.value = button.dataset.value;
      });
    });

    // Default visibility to public
    const defaultVisibility = "public";
    const defaultBtn = document.querySelector(`.visibility-btn[data-value="${defaultVisibility}"]`);
    if (defaultBtn) {
      defaultBtn.classList.add('active');
      hiddenInput.value = defaultVisibility;
    }

    // Back button goes to previous page in history
    document.getElementById('back-button').addEventListener('click', () => {
      window.history.back();
    });
  </script>

</body>
</html>
